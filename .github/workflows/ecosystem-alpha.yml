name: CAPSULA Ecosystem Alpha

on:
  pull_request:
  push:
    branches: [ecosystem-alpha-protocol-v1]

permissions:
  contents: read

jobs:
  ecosystem-adapter:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile adapter
        run: python -m py_compile capsula/ecosystem.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run ecosystem adapter tests
        run: python -m pytest -q tests/test_ecosystem.py
